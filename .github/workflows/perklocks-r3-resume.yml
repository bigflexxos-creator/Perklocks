name: Perklocks R3 Resume

# Temporary, one-shot migration workflow.  Runs the EXTERNAL R3
# resume controller from GitHub-hosted infrastructure so the import
# is immune to Emergent Production pod recycles.
#
# This workflow MUST NOT be triggered automatically; manual dispatch
# only.  It is scheduled for removal immediately after Phase 8 PASS.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resume-r3:
    name: External R3 Resume (Phase 5 → 8, STOP at Phase 9)
    runs-on: ubuntu-latest

    # 6-hour cap is the GitHub-hosted maximum.  The push driver is
    # idempotent-resumable, so even if the job hits the ceiling we can
    # re-run and the ~749 succeeded batches skip in fast-path.
    timeout-minutes: 350

    env:
      # Paths are per-run ephemeral — nothing persists on the runner.
      # Using static /tmp paths (ubuntu-latest runners always have
      # /tmp writable) so the env block does not reference the
      # ${{ runner.* }} context before a runner is bound.
      CHKP_DIR:        /tmp/perklocks-checkpoints
      RECONCILE_TMP:   /tmp/perklocks-reconcile
      LOGS_DIR:        /tmp/perklocks-logs
      MAX_BATCH_SIZE:  "250"

      # Phase-5-R3 ACCELERATED knobs.  The accelerated push driver
      # (push_canonical_accelerated.py) fast-skips DONE collections,
      # uses NEW_COLLECTION_BATCH_SIZE for NOT-STARTED collections,
      # and parallelises HTTP POSTs via a bounded ThreadPoolExecutor.
      # Server contract, atomic protocol, and session bookkeeping are
      # unchanged — only transport is accelerated.
      USE_ACCELERATED_PUSH:       "1"
      NEW_COLLECTION_BATCH_SIZE:  "1000"
      CONCURRENCY:                "8"

      # Pinned SHA-256s.  The job aborts hard if the downloaded bytes
      # do not match EXACTLY.  Hardcoded here (not a secret) so the
      # verification is auditable in the workflow definition itself.
      PHASE5_SHA256: 4adc99890885e7b712adfd491124c2ef681715996167d19719ddb04f8eb1e9d7
      PHASE6_SHA256: 327a38903daf3bd910ab50b68f69415cfcf181624655b42fb791af43042b6c22

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare runner directories
        run: |
          mkdir -p "$CHKP_DIR" "$RECONCILE_TMP" "$LOGS_DIR"
          echo "CHKP_DIR=$CHKP_DIR"
          echo "RECONCILE_TMP=$RECONCILE_TMP"
          echo "LOGS_DIR=$LOGS_DIR"

      # ─── Download + verify checkpoints ─────────────────────────────
      # Each file is downloaded with HTTP Range-aware resume, bounded
      # retries, byte-count check, then SHA-256 check.  If the local
      # file ever exists at the full expected size but SHA-invalid,
      # the corrupted runner-local copy is discarded and re-downloaded
      # from scratch.  The job fails closed after MAX_ATTEMPTS without
      # a valid file so R3 Resume cannot run on bad data.
      #
      # Secrets are passed through the step `env:` block so GitHub
      # Actions auto-masks any accidental echo; the token is never
      # interpolated inline into the curl command string.
      - name: Download + verify phase5 checkpoint (resume-aware, SHA-gated)
        env:
          PREVIEW_BASE_URL:         ${{ secrets.PREVIEW_BASE_URL }}
          MIGRATION_DOWNLOAD_TOKEN: ${{ secrets.MIGRATION_DOWNLOAD_TOKEN }}
          FILE:                     phase5_20261003_190628Z.tar.gz
          EXPECTED_BYTES:           "337143523"
          EXPECTED_SHA:             4adc99890885e7b712adfd491124c2ef681715996167d19719ddb04f8eb1e9d7
          MAX_ATTEMPTS:             "6"
        run: |
          set -eu
          TARGET="${CHKP_DIR}/${FILE}"
          URL="${PREVIEW_BASE_URL}/api/_migration_download/${FILE}"
          for ATTEMPT in $(seq 1 "${MAX_ATTEMPTS}"); do
            echo "--- ${FILE} attempt ${ATTEMPT}/${MAX_ATTEMPTS} ---"
            CURRENT_SIZE=$(stat -c%s "${TARGET}" 2>/dev/null || echo 0)

            # Discard anything larger than expected (corruption / stale).
            if [ "${CURRENT_SIZE}" -gt "${EXPECTED_BYTES}" ]; then
              echo "  oversized local copy (${CURRENT_SIZE} > ${EXPECTED_BYTES}) — discarding"
              rm -f "${TARGET}"
              CURRENT_SIZE=0
            fi

            # Download/resume when local file is smaller than expected.
            if [ "${CURRENT_SIZE}" -lt "${EXPECTED_BYTES}" ]; then
              if [ "${CURRENT_SIZE}" -gt 0 ]; then
                echo "  partial local copy (${CURRENT_SIZE}/${EXPECTED_BYTES}) — resuming via HTTP Range"
                CURL_CONTINUE="--continue-at -"
              else
                CURL_CONTINUE=""
              fi
              # shellcheck disable=SC2086
              if ! curl --fail --silent --show-error --location \
                       --retry 3 --retry-all-errors --retry-delay 5 \
                       --max-time 1800 \
                       ${CURL_CONTINUE} \
                       -H "X-Download-Token: ${MIGRATION_DOWNLOAD_TOKEN}" \
                       -o "${TARGET}" "${URL}"; then
                echo "  curl failed on attempt ${ATTEMPT}; backing off"
                sleep 8
                continue
              fi
              CURRENT_SIZE=$(stat -c%s "${TARGET}" 2>/dev/null || echo 0)
            fi

            if [ "${CURRENT_SIZE}" -ne "${EXPECTED_BYTES}" ]; then
              echo "  size mismatch after download (got ${CURRENT_SIZE}, expected ${EXPECTED_BYTES}) — retrying"
              sleep 5
              continue
            fi

            ACTUAL_SHA=$(sha256sum "${TARGET}" | awk '{print $1}')
            if [ "${ACTUAL_SHA}" = "${EXPECTED_SHA}" ]; then
              echo "  ✅ ${FILE}  bytes=${CURRENT_SIZE}  sha256=${ACTUAL_SHA}"
              exit 0
            fi

            echo "  ❌ SHA mismatch (got ${ACTUAL_SHA}, expected ${EXPECTED_SHA}) — discarding runner-local corrupted copy"
            rm -f "${TARGET}"
            sleep 5
          done
          echo "FATAL: exhausted ${MAX_ATTEMPTS} attempts for ${FILE} without a valid download" >&2
          exit 1

      - name: Download + verify phase6 checkpoint (resume-aware, SHA-gated)
        env:
          PREVIEW_BASE_URL:         ${{ secrets.PREVIEW_BASE_URL }}
          MIGRATION_DOWNLOAD_TOKEN: ${{ secrets.MIGRATION_DOWNLOAD_TOKEN }}
          FILE:                     phase6_20261003_192150Z.tar.gz
          EXPECTED_BYTES:           "1606247"
          EXPECTED_SHA:             327a38903daf3bd910ab50b68f69415cfcf181624655b42fb791af43042b6c22
          MAX_ATTEMPTS:             "6"
        run: |
          set -eu
          TARGET="${CHKP_DIR}/${FILE}"
          URL="${PREVIEW_BASE_URL}/api/_migration_download/${FILE}"
          for ATTEMPT in $(seq 1 "${MAX_ATTEMPTS}"); do
            echo "--- ${FILE} attempt ${ATTEMPT}/${MAX_ATTEMPTS} ---"
            CURRENT_SIZE=$(stat -c%s "${TARGET}" 2>/dev/null || echo 0)

            if [ "${CURRENT_SIZE}" -gt "${EXPECTED_BYTES}" ]; then
              echo "  oversized local copy (${CURRENT_SIZE} > ${EXPECTED_BYTES}) — discarding"
              rm -f "${TARGET}"
              CURRENT_SIZE=0
            fi

            if [ "${CURRENT_SIZE}" -lt "${EXPECTED_BYTES}" ]; then
              if [ "${CURRENT_SIZE}" -gt 0 ]; then
                echo "  partial local copy (${CURRENT_SIZE}/${EXPECTED_BYTES}) — resuming via HTTP Range"
                CURL_CONTINUE="--continue-at -"
              else
                CURL_CONTINUE=""
              fi
              # shellcheck disable=SC2086
              if ! curl --fail --silent --show-error --location \
                       --retry 3 --retry-all-errors --retry-delay 5 \
                       --max-time 600 \
                       ${CURL_CONTINUE} \
                       -H "X-Download-Token: ${MIGRATION_DOWNLOAD_TOKEN}" \
                       -o "${TARGET}" "${URL}"; then
                echo "  curl failed on attempt ${ATTEMPT}; backing off"
                sleep 6
                continue
              fi
              CURRENT_SIZE=$(stat -c%s "${TARGET}" 2>/dev/null || echo 0)
            fi

            if [ "${CURRENT_SIZE}" -ne "${EXPECTED_BYTES}" ]; then
              echo "  size mismatch after download (got ${CURRENT_SIZE}, expected ${EXPECTED_BYTES}) — retrying"
              sleep 4
              continue
            fi

            ACTUAL_SHA=$(sha256sum "${TARGET}" | awk '{print $1}')
            if [ "${ACTUAL_SHA}" = "${EXPECTED_SHA}" ]; then
              echo "  ✅ ${FILE}  bytes=${CURRENT_SIZE}  sha256=${ACTUAL_SHA}"
              exit 0
            fi

            echo "  ❌ SHA mismatch (got ${ACTUAL_SHA}, expected ${EXPECTED_SHA}) — discarding runner-local corrupted copy"
            rm -f "${TARGET}"
            sleep 4
          done
          echo "FATAL: exhausted ${MAX_ATTEMPTS} attempts for ${FILE} without a valid download" >&2
          exit 1

      - name: Resume R3 (Phase 5 → 7 → 8, STOP at Phase 9)
        env:
          # All secrets passed via env so GitHub Actions auto-masks
          # them in logs.  Never interpolated inline into shell.
          PROD_API_BASE:            ${{ secrets.PROD_API_BASE }}
          PROD_ADMIN_EMAIL:         ${{ secrets.PROD_ADMIN_EMAIL }}
          PROD_ADMIN_PASSWORD:      ${{ secrets.PROD_ADMIN_PASSWORD }}
          CANONICAL_IMPORT_TOKEN:   ${{ secrets.CANONICAL_IMPORT_TOKEN }}
          CANONICAL_IMPORT_SESSION: ${{ secrets.CANONICAL_IMPORT_SESSION }}
        run: |
          python3 --version
          echo "[workflow] launching external R3 controller"
          echo "[workflow] CHKP_DIR=${CHKP_DIR}"
          echo "[workflow] LOGS_DIR=${LOGS_DIR}"
          echo "[workflow] MAX_BATCH_SIZE=${MAX_BATCH_SIZE}"
          echo "[workflow] USE_ACCELERATED_PUSH=${USE_ACCELERATED_PUSH}"
          echo "[workflow] NEW_COLLECTION_BATCH_SIZE=${NEW_COLLECTION_BATCH_SIZE}"
          echo "[workflow] CONCURRENCY=${CONCURRENCY}"
          python3 -u reconcile_workspace/scripts/resume_r3_no_reset.py
        # If any sub-exit code is non-zero the job fails but we still
        # upload the logs via the always()-guarded step below.

      - name: Upload Phase 8 report + push driver logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perklocks-r3-resume-artifacts-${{ github.run_id }}
          path: |
            /tmp/perklocks-logs/**
          if-no-files-found: warn
          retention-days: 30

      - name: Final status
        if: always()
        run: |
          echo "Job status (step/job-level): ${{ job.status }}"
          echo "Artifacts: perklocks-r3-resume-artifacts-${{ github.run_id }}"
          echo "STOPPED at Phase 9 per controller contract."
