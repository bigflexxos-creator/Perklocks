[pytest]
testpaths = tests
python_files = test_*.py
markers =
    unit: pure unit tests (no DB, no network, no live services)
    contract: contract tests that pin interface behaviour (mocked deps)
    integration: exercise real local infra (Mongo) but no live external providers
    live_smoke: hit LIVE external providers or LIVE preview URLs — skipped by default in CI
    slow: takes >5s
addopts = -ra --strict-markers
filterwarnings =
    ignore::DeprecationWarning
